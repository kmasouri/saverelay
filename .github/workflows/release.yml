name: Release

# Push a tag like v0.1.1 (npm version patch && git push --follow-tags) to build
# the Windows installer. Installed copies pick the update up automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-syncthing.mjs win32 x64
      - run: npm run build

      # Public, binaries-only update feed (see README). Skipped until the token exists.
      - name: Build and publish to the update feed
        if: ${{ env.RELEASES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
      - name: Build without publishing
        if: ${{ env.RELEASES_TOKEN == '' }}
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: CalmEmber-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach installer to a release in this repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "Calm Ember $GITHUB_REF_NAME" \
            --notes "Windows installer. Download CalmEmber-Setup-*.exe and run it." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml --repo "$GITHUB_REPOSITORY" --clobber

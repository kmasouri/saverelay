name: Release

# Push a tag like v0.1.2 (npm version patch && git push --follow-tags) to build the
# Windows installer and publish it as a GitHub release of this repo. Installed copies
# read that release feed and update themselves in the background.
# Manual runs build and test the installer without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-syncthing.mjs win32 x64
      # Task Manager and firewall prompts show a program's built-in description and icon.
      # Label the bundled Syncthing as part of SaveRelay and preserve its copyright string.
      # Packaging includes the upstream license text in LICENSES.html.
      - name: Label Syncthing as SaveRelay Sync
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { rcedit } from 'rcedit'
          // An .ico can hold a PNG as-is: a 6-byte header, one 16-byte entry, then the PNG.
          const png = readFileSync('resources/app-icon.png')
          const header = Buffer.alloc(22)
          header.writeUInt16LE(1, 2) // type: icon
          header.writeUInt16LE(1, 4) // one image
          header.writeUInt16LE(1, 10) // colour planes
          header.writeUInt16LE(32, 12) // bits per pixel
          header.writeUInt32LE(png.length, 14)
          header.writeUInt32LE(22, 18) // image data offset
          writeFileSync('saverelay-sync.ico', Buffer.concat([header, png]))
          await rcedit('resources/syncthing/win32-x64/syncthing.exe', {
            icon: 'saverelay-sync.ico',
            'version-string': {
              FileDescription: 'SaveRelay Sync',
              ProductName: 'SaveRelay Sync',
              Comments: 'Syncthing, bundled with SaveRelay to move saves between friends',
            },
          })
          EOF
      - run: npm run build
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the packaged app
        shell: bash
        run: |
          ls -la dist/win-unpacked/resources dist/win-unpacked/resources/syncthing
          test -f dist/win-unpacked/resources/syncthing/syncthing.exe
          test -f dist/win-unpacked/resources/app-icon.png
          test -f dist/win-unpacked/resources/tray.png
          test -f dist/win-unpacked/LICENSES.html
          test ! -e dist/win-unpacked/LICENSE.electron.txt
          test ! -e dist/win-unpacked/LICENSES.chromium.html
          test ! -e dist/win-unpacked/resources/syncthing/LICENSE.txt
          grep -Fq 'Chromium credits and licenses' dist/win-unpacked/LICENSES.html
          grep -Fq '@material-symbols/svg-400@' dist/win-unpacked/LICENSES.html
          grep -Fq 'https://github.com/syncthing/syncthing/tree/' dist/win-unpacked/LICENSES.html
          cat dist/win-unpacked/resources/app-update.yml

      - name: Install and smoke test SaveRelay
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SaveRelay"
          $installer = Get-Item "dist/SaveRelay-Setup-*.exe"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $licenses = Join-Path $installDir "LICENSES.html"
          if ((Get-FileHash $licenses).Hash -ne (Get-FileHash "dist/win-unpacked/LICENSES.html").Hash) {
            throw "Installed license document does not match the packaged copy"
          }
          $exe = Join-Path $installDir "SaveRelay.exe"
          $log = Join-Path $env:APPDATA "SaveRelay/logs/main.log"
          function Wait-Log($pattern) {
            for ($i = 0; $i -lt 60; $i++) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern $pattern -Quiet)) { return $true }
              Start-Sleep -Seconds 2
            }
            return $false
          }
          function Wait-AllStopped {
            for ($i = 0; $i -lt 30; $i++) {
              if (-not (Get-Process -Name "SaveRelay","syncthing" -ErrorAction SilentlyContinue)) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          function Show-Log { if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 } }
          function Fail($msg) { Show-Log; Get-Process -Name "SaveRelay","syncthing" -ErrorAction SilentlyContinue | Stop-Process -Force; throw $msg }

          $desc = (Get-Item (Join-Path $installDir "resources/syncthing/syncthing.exe")).VersionInfo.FileDescription
          if ($desc -ne "SaveRelay Sync") { throw "Bundled Syncthing is labelled '$desc', expected 'SaveRelay Sync'" }

          # 1. Starts cleanly and quits leaving nothing running.
          Start-Process -FilePath $exe -ArgumentList "--hidden"
          if (-not (Wait-Log "Syncthing started as")) { Fail "App did not start Syncthing" }
          Start-Sleep -Seconds 5
          if (Select-String -Path $log -Pattern "failed|exited unexpectedly" -Quiet) { Fail "Errors in startup log" }
          Start-Process -FilePath $exe -ArgumentList "--quit"
          if (-not (Wait-AllStopped)) { Fail "Quitting left SaveRelay or Syncthing running" }

          # 2. After a hard kill leaves Syncthing behind, the next start takes over and quits cleanly.
          Remove-Item $log
          Start-Process -FilePath $exe -ArgumentList "--hidden"
          if (-not (Wait-Log "Syncthing started as")) { Fail "App did not start Syncthing the second time" }
          Get-Process -Name "SaveRelay" | Stop-Process -Force
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name "syncthing" -ErrorAction SilentlyContinue)) { Fail "Expected Syncthing to outlive the killed app" }
          Start-Process -FilePath $exe -ArgumentList "--hidden"
          if (-not (Wait-Log "stopped a copy left running")) { Fail "App did not take over from the leftover Syncthing" }
          for ($i = 0; $i -lt 30 -and @(Select-String -Path $log -Pattern "Syncthing started as").Count -lt 2; $i++) { Start-Sleep -Seconds 2 }
          if (@(Select-String -Path $log -Pattern "Syncthing started as").Count -lt 2) { Fail "App did not start Syncthing after taking over" }
          Start-Process -FilePath $exe -ArgumentList "--quit"
          if (-not (Wait-AllStopped)) { Fail "Quitting after a takeover left something running" }
          Show-Log

      - uses: actions/upload-artifact@v4
        with:
          name: SaveRelay-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      # Only after the smoke test passes: the installer, blockmap and latest.yml form the update feed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "SaveRelay $GITHUB_REF_NAME" \
            --notes "Windows installer: download SaveRelay-Setup-*.exe and run it. Installed copies update automatically."

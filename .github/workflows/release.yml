name: Release

# Push a tag like v0.1.2 (npm version patch && git push --follow-tags) to build the
# Windows installer and publish it as a GitHub release of this repo. Installed copies
# read that release feed and update themselves in the background.
# Manual runs build and test the installer without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-syncthing.mjs win32 x64
      - run: npm run build
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the packaged app
        shell: bash
        run: |
          ls -la dist/win-unpacked/resources dist/win-unpacked/resources/syncthing
          test -f dist/win-unpacked/resources/syncthing/syncthing.exe
          test -f dist/win-unpacked/resources/tray.png
          cat dist/win-unpacked/resources/app-update.yml

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/SaveRelay.exe" -ArgumentList "--hidden" -PassThru
          $log = Join-Path $env:APPDATA "SaveRelay/logs/main.log"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Syncthing started as" -Quiet)) { $ok = $true; break }
          }
          Start-Sleep -Seconds 5
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }
          Get-Process -Name "SaveRelay","syncthing" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "App did not start Syncthing" }
          if (Select-String -Path $log -Pattern "failed|exited unexpectedly" -Quiet) { throw "Errors in startup log" }

      - uses: actions/upload-artifact@v4
        with:
          name: SaveRelay-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      # Only after the smoke test passes: the installer, blockmap and latest.yml form the update feed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "SaveRelay $GITHUB_REF_NAME" \
            --notes "Windows installer: download SaveRelay-Setup-*.exe and run it. Installed copies update automatically."

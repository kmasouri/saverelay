name: Release

# Push a tag like v0.1.1 (npm version patch && git push --follow-tags) to build
# the Windows installer. Installed copies pick the update up automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-syncthing.mjs win32 x64
      - run: npm run build

      # Public, binaries-only update feed (see README). Skipped until the token exists.
      - name: Build and publish to the update feed
        if: ${{ env.RELEASES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
      - name: Build without publishing
        if: ${{ env.RELEASES_TOKEN == '' }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the packaged app
        shell: bash
        run: |
          ls -la dist/win-unpacked/resources dist/win-unpacked/resources/syncthing
          test -f dist/win-unpacked/resources/syncthing/syncthing.exe
          test -f dist/win-unpacked/resources/tray.png
          cat dist/win-unpacked/resources/app-update.yml

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/Calm Ember.exe" -ArgumentList "--hidden" -PassThru
          $log = Join-Path $env:APPDATA "Calm Ember/logs/main.log"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Syncthing started as" -Quiet)) { $ok = $true; break }
          }
          Start-Sleep -Seconds 5
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }
          Get-Process -Name "Calm Ember","syncthing" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "App did not start Syncthing" }
          if (Select-String -Path $log -Pattern "failed|exited unexpectedly" -Quiet) { throw "Errors in startup log" }

      - uses: actions/upload-artifact@v4
        with:
          name: CalmEmber-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Attach installer to a release in this repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --title "Calm Ember $GITHUB_REF_NAME" \
            --notes "Windows installer. Download CalmEmber-Setup-*.exe and run it." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/latest.yml --repo "$GITHUB_REPOSITORY" --clobber

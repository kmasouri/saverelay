appId: com.kmasouri.saverelay
productName: SaveRelay
copyright: Copyright © 2026 Kayvan Masouri
icon: installer-icon.png
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - '!out/*/license-report.json'
  - package.json
afterPack: ./scripts/package-licenses.mjs
extraResources:
  - from: resources
    to: .
    filter: ["app-icon.png", "tray.png", "tray@2x.png"]
win:
  extraResources:
    - from: resources/syncthing/win32-${arch}
      to: syncthing
  target:
    - target: nsis
      arch: [x64]
  artifactName: SaveRelay-Setup-${version}.${ext}
nsis:
  # Per-user, no admin prompt: updates install silently in the background like Discord.
  oneClick: true
  perMachine: false
  allowElevation: false
  differentialPackage: true
  deleteAppDataOnUninstall: false
  shortcutName: SaveRelay
mac:
  extraResources:
    - from: resources/syncthing/darwin-${arch}
      to: syncthing
  target: [dmg]
  category: public.app-category.games
linux:
  extraResources:
    - from: resources/syncthing/linux-${arch}
      to: syncthing
  target: [AppImage]
  category: Game
publish:
  provider: github
  owner: kmasouri
  repo: saverelay
  releaseType: release
